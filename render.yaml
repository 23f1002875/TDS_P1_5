services:
  - type: web
    name: telegram-data-bot
    env: python
    region: oregon
    plan: free
    dockerCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: [https://api.openai.com/v1](https://api.openai.com/v1)
      - key: LLM_MODEL
        value: gpt-4o
